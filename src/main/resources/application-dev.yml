
#内嵌的Tomcat端口
server:
  port: 8088

spring:
  application:
    name: dlyk-server

  # 关闭 DevTools 热重启，避免 IDE 重复启动时 8088 端口冲突
  devtools:
    restart:
      enabled: false

  #jackson进行json转换时使用指定的时区和格式进行转换
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  #数据库
  datasource:
    username: root
    password: 020916
    url: jdbc:mysql://localhost:3306/dlyk?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver

  #redis
  data:
    redis:
      host: 192.168.191.131
      port: 6379
#      password: 123456
      database: 0
mybatis:
  # 显式扫描 Mapper XML（含 resources 与 java 目录下的 xml，避免 IDE 直接运行漏打包）
  mapper-locations: classpath*:com/bjpowernode/mapper/*.xml
  configuration: # 配置打印 MyBatis⽇志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
